# render.yaml — SmartFulfill AI Warehouse Management System
# This file codifies both Render services: backend API + frontend static site.
# Commit this file to Git so deployments are reproducible.

services:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. Backend Flask API (Web Service)
  # ─────────────────────────────────────────────────────────────────────────
  - type: web
    name: smartfulfill-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true        # Render auto-generates a secure random value
      - key: JWT_SECRET_KEY
        generateValue: true        # Render auto-generates a secure random value
      - key: DATABASE_URL
        value: sqlite:///smartfulfill.db
      - key: GEMINI_API_KEY
        sync: false                # Set manually in Render dashboard (optional)
      - key: FRONTEND_URL
        sync: false                # Set to your deployed frontend URL, e.g. https://smartfulfill.onrender.com

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Frontend React/Vite (Static Site)
  # ─────────────────────────────────────────────────────────────────────────
  - type: web
    name: smartfulfill
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false                # Set to https://smartfulfill-api.onrender.com (your backend URL)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
